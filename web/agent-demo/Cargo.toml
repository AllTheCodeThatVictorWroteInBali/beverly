[package]
name = "beverly-agent-demo"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
beverly = { path = "../..", default-features = false }
bevy = { version = "0.19.1", default-features = false, features = ["2d", "ui"] }
web-time = "1"
wasm-bindgen = "=0.2.129"
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 16
panic = "abort"
strip = "symbols"