<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self'; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co; img-src 'self' data:; object-src 'none'; base-uri 'self'">
  <title>Beverly Agent</title>
  <style>
    html,body { width:100%;height:100%;margin:0;overflow:hidden;background:#fff;color:#27272a; }
    #bevy { display:block;width:100%;height:100%;outline:none;touch-action:none; }
    #loading-screen { position:fixed;inset:0;display:grid;place-items:center;background:#fff;z-index:3;font:14px sans-serif; }
    #loading-screen[hidden],#platform-notice[hidden] { display:none; }
    #platform-notice { position:fixed;bottom:8px;left:16px;right:16px;margin:0;padding:8px;background:#fff;border:1px solid #d4d4d8;font:13px sans-serif;z-index:4; }
    .sr-only { position:fixed;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap; }
    .spinner { width:28px;height:28px;border:3px solid #e4e4e7;border-top-color:#27272a;border-radius:50%;animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media(prefers-reduced-motion:reduce) { .spinner { animation-duration:2s; } }
  </style>
  <script src="shell.js" defer></script>
</head>
<body>
  <div id="loading-screen" role="status" aria-label="Loading Beverly Agent"><span class="spinner" aria-hidden="true"></span></div>
  <p id="platform-notice" role="status" aria-live="polite" hidden></p>
  <p id="agent-announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <canvas id="bevy" tabindex="0" aria-label="Beverly Agent conversation"></canvas>
  <link data-trunk rel="copy-file" href="shell.js">
  <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory-opt --enable-nontrapping-float-to-int">
</body>
</html>
