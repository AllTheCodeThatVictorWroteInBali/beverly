[package]
name = "beverly-demos"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = []

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["2d", "ui"] }
beverly = { path = "../..", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Document", "Element", "Window", "Location", "UrlSearchParams"] }

[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 16
strip = "symbols"
panic = "abort"