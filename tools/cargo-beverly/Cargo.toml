[package]
name = "cargo-beverly"
version = "0.1.0"
edition = "2024"
description = "Developer CLI for Beverly projects (`cargo beverly ...`)."
license = "Apache-2.0"
publish = false

[[bin]]
name = "cargo-beverly"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.19"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
