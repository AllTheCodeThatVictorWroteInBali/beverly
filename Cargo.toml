[package]
name = "beverly"
version = "0.0.2"
edition = "2024"
description = "A Rust-native, accessible UI component library for Bevy."
license = "Apache-2.0"
repository = "https://github.com/AllTheCodeThatVictorWroteInBali/beverly"
homepage = "https://beverlyui.com"
documentation = "https://beverlyui.com/docs/"
readme = "README.md"
keywords = ["bevy", "ui", "gamedev", "accessibility", "components"]
categories = ["game-development", "gui"]
exclude = ["docs/", "index.html"]

include = [
    "src/**",
    "assets/**",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[lib]
name = "beverly"
path = "src/lib.rs"

[dependencies]
bevy = "0.19"
bevy_svg = "0.19"
ab_glyph = "0.2"
accesskit = "0.24"
parley = "0.9"
rustybuzz = "0.20"
unicode-bidi = "0.3"
unicode-script = "0.5"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optional integrations, enabled via Cargo features.
rfd = { version = "0.15", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }

[features]
default = ["file_dialog"]
## Native file picker support for `FileInput`.
file_dialog = ["dep:rfd"]
## HTTP form submission support for `Form`.
http_form = ["dep:reqwest"]
## Exposes headless UI-transform test fixtures for downstream crates' own tests.
test-support = []

[[example]]
name = "showcase"

[[example]]
name = "buttons"

[[example]]
name = "cards"

[[example]]
name = "components"

[[example]]
name = "hello_world"
