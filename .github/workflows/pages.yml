name: Deploy Beverly

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: v0.21.14

      - name: Cache embedded button demo
        id: button-demo-cache
        uses: actions/cache@v4
        with:
          path: web/button-demo/dist
          key: button-demo-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'beverly-macros/Cargo.toml', 'beverly-macros/src/**', 'src/**', 'examples/button.rs', 'web/button-demo/Cargo.toml', 'web/button-demo/Cargo.lock', 'web/button-demo/Trunk.toml', 'web/button-demo/build.sh', 'web/button-demo/index.html', 'web/button-demo/src/**') }}

      - name: Cache shared demo bundle
        id: demos-cache
        uses: actions/cache@v4
        with:
          path: web/demos/dist
          key: demos-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'beverly-macros/Cargo.toml', 'beverly-macros/src/**', 'src/**', 'examples/**', 'assets/avatars/**', 'web/demos/Cargo.toml', 'web/demos/Cargo.lock', 'web/demos/Trunk.toml', 'web/demos/build.rs', 'web/demos/build.sh', 'web/demos/index.html', 'web/demos/manifest.json', 'web/demos/src/**') }}

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            web/button-demo -> target
            web/demos -> target

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: Build documentation
        run: mdbook build docs

      - name: Build or reuse embedded demos
        env:
          BUTTON_CACHED: ${{ steps.button-demo-cache.outputs.cache-hit == 'true' }}
          DEMOS_CACHED: ${{ steps.demos-cache.outputs.cache-hit == 'true' }}
        run: |
          SKIP_TRUNK_BUILD="$BUTTON_CACHED" TRUNK_PUBLIC_URL=/docs/assets/button-demo/ bash web/button-demo/build.sh &
          button_pid=$!
          SKIP_TRUNK_BUILD="$DEMOS_CACHED" TRUNK_PUBLIC_URL=/docs/assets/demos/ bash web/demos/build.sh
          wait "$button_pid"

      - name: Assemble site
        run: |
          mkdir -p _site/docs

          cp -R docs/book/* _site/docs/

          cp index.html _site/
          cp -R assets _site/

          echo "=== Published site ==="
          find _site -maxdepth 2 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
