name: Release Beverly Agent for macOS

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.event.release.tag_name, 'bev-test-v')
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_TEAM_ID \
            APPLE_API_KEY_BASE64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Actions secret is missing: $name"
              exit 1
            fi
            printf '::add-mask::%s\n' "${!name}"
          done

          if [[ "$APPLE_TEAM_ID" != "MAYGW2FTG7" ]]; then
            echo "::error::APPLE_TEAM_ID does not match the configured Developer ID team."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Verify Apple Silicon toolchain
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "arm64" ]]
          [[ "$(rustc -vV | sed -n 's/^host: //p')" == "aarch64-apple-darwin" ]]
          xcodebuild -version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            apps/beverly-agent -> apps/beverly-agent/target

      - name: Build and package BeverlyAgent.app
        run: |
          set -euo pipefail
          app_version="$(cargo metadata --no-deps --format-version 1 \
            --manifest-path apps/beverly-agent/Cargo.toml | jq -r '.packages[0].version')"
          expected_tag="bev-test-v${app_version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::Release tag $RELEASE_TAG must match app version tag $expected_tag."
            exit 1
          fi

          cargo run --release --locked \
            --manifest-path tools/cargo-beverly/Cargo.toml -- \
            publish \
            --manifest-path apps/beverly-agent/Cargo.toml \
            --target macos-arm64 \
            --locked \
            --out-dir dist

          app_path="$GITHUB_WORKSPACE/dist/BeverlyAgent.app"
          test -x "$app_path/Contents/MacOS/BeverlyAgent"
          test -f "$app_path/Contents/Info.plist"
          test -f "$app_path/Contents/Resources/assets/beverly_logo_black.png"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")" == "com.beverlyui.beverly-agent" ]]
          /usr/bin/file "$app_path/Contents/MacOS/BeverlyAgent" | grep -q 'arm64'

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/beverly-release.keychain-db"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          original_keychains_file="$RUNNER_TEMP/original-keychains.txt"
          security list-keychains -d user \
            | sed -E 's/^[[:space:]]*"(.*)"$/\1/' \
            > "$original_keychains_file"
          original_keychains=()
          while IFS= read -r keychain; do
            [[ -n "$keychain" ]] && original_keychains+=("$keychain")
          done < "$original_keychains_file"
          security list-keychains -d user -s "$keychain_path" "${original_keychains[@]}"

          identity="Developer ID Application: Victor Venters ($APPLE_TEAM_ID)"
          identities="$RUNNER_TEMP/signing-identities.txt"
          security find-identity -v -p codesigning "$keychain_path" > "$identities"
          if ! grep -Fq "$identity" "$identities"; then
            echo "::error::The imported keychain does not contain the required Developer ID Application identity."
            exit 1
          fi

      - name: Sign and verify app bundle
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app_path="$GITHUB_WORKSPACE/dist/BeverlyAgent.app"
          main_executable="$app_path/Contents/MacOS/BeverlyAgent"
          identity="Developer ID Application: Victor Venters ($APPLE_TEAM_ID)"
          keychain_path="$RUNNER_TEMP/beverly-release.keychain-db"

          # Sign Mach-O code first, then nested code bundles deepest-first.
          while IFS= read -r -d '' code_file; do
            [[ "$code_file" == "$main_executable" ]] && continue
            if /usr/bin/file -b "$code_file" | grep -q 'Mach-O'; then
              codesign --force --options runtime --timestamp \
                --keychain "$keychain_path" --sign "$identity" "$code_file"
            fi
          done < <(find "$app_path/Contents" -type f -print0)

          while IFS= read -r -d '' code_bundle; do
            if find "$code_bundle" -type f -exec /usr/bin/file -b {} + | grep -q 'Mach-O'; then
              codesign --force --options runtime --timestamp \
                --keychain "$keychain_path" --sign "$identity" "$code_bundle"
            fi
          done < <(
            find "$app_path/Contents" -depth -type d \
              \( -name '*.app' -o -name '*.framework' -o -name '*.xpc' \
                 -o -name '*.appex' -o -name '*.plugin' -o -name '*.bundle' \) \
              -print0
          )

          codesign --force --options runtime --timestamp \
            --keychain "$keychain_path" --sign "$identity" "$main_executable"
          codesign --force --options runtime --timestamp \
            --keychain "$keychain_path" --sign "$identity" "$app_path"

          while IFS= read -r -d '' code_file; do
            if /usr/bin/file -b "$code_file" | grep -q 'Mach-O'; then
              codesign --verify --strict --verbose=2 "$code_file"
            fi
          done < <(find "$app_path/Contents" -type f -print0)

          while IFS= read -r -d '' code_bundle; do
            if find "$code_bundle" -type f -exec /usr/bin/file -b {} + | grep -q 'Mach-O'; then
              codesign --verify --strict --verbose=2 "$code_bundle"
            fi
          done < <(
            find "$app_path/Contents" -depth -type d \
              \( -name '*.app' -o -name '*.framework' -o -name '*.xpc' \
                 -o -name '*.appex' -o -name '*.plugin' -o -name '*.bundle' \) \
              -print0
          )
          codesign --verify --strict --verbose=2 "$app_path"

          details="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
          printf '%s\n' "$details" | grep -Fq "Authority=$identity"
          printf '%s\n' "$details" | grep -Fq "TeamIdentifier=$APPLE_TEAM_ID"

      - name: Notarize, staple, and validate app
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          app_path="$GITHUB_WORKSPACE/dist/BeverlyAgent.app"
          zip_path="$RUNNER_TEMP/BeverlyAgent-macOS-arm64.zip"
          api_key_path="$RUNNER_TEMP/AuthKey.p8"
          submit_output="$RUNNER_TEMP/notary-submit.json"
          submit_error="$RUNNER_TEMP/notary-submit.stderr"

          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$api_key_path"
          chmod 600 "$api_key_path"
          ditto -c -k --keepParent "$app_path" "$zip_path"

          : > "$submit_output"
          : > "$submit_error"
          set +e
          xcrun notarytool submit "$zip_path" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --output-format json \
            > "$submit_output" 2> "$submit_error"
          submit_exit=$?
          set -e

          cat "$submit_error"
          cat "$submit_output"
          submission_id="$(jq -r '.id // empty' "$submit_output" 2>/dev/null || true)"
          status="$(jq -r '.status // empty' "$submit_output" 2>/dev/null || true)"
          if [[ "$submit_exit" -ne 0 || "$status" != "Accepted" ]]; then
            if [[ -n "$submission_id" ]]; then
              echo "Notarization failed; retrieving Apple's log for submission $submission_id."
              xcrun notarytool log "$submission_id" \
                --key "$api_key_path" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID" \
                > "$RUNNER_TEMP/notary-log.json" 2>&1 || true
              cat "$RUNNER_TEMP/notary-log.json"
            else
              echo "No notarization submission ID was returned; see the submit output above."
            fi
            echo "::error::Apple did not accept this app for notarization."
            exit 1
          fi

          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"
          codesign --verify --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

          rm -f "$zip_path"
          ditto -c -k --keepParent "$app_path" "$zip_path"

      - name: Upload notarized ZIP to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_name="BeverlyAgent-macOS-arm64.zip"
          zip_path="$RUNNER_TEMP/$asset_name"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq ".assets[].name" | grep -Fxq "$asset_name"; then
            echo "Replacing the existing $asset_name asset from an earlier run of this workflow."
          fi

          # --clobber affects only this exact, workflow-owned filename.
          gh release upload "$RELEASE_TAG" "$zip_path" \
            --repo "$GITHUB_REPOSITORY" --clobber

          local_digest="$(shasum -a 256 "$zip_path" | awk '{ print $1 }')"
          remote_digest="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq ".assets[] | select(.name == \"$asset_name\") | .digest" \
            | sed 's/^sha256://')"
          if [[ "$local_digest" != "$remote_digest" ]]; then
            echo "::error::Uploaded release asset digest does not match the notarized ZIP."
            exit 1
          fi

      - name: Remove temporary signing material
        if: always()
        run: |
          set +e
          keychain_path="$RUNNER_TEMP/beverly-release.keychain-db"
          original_keychains_file="$RUNNER_TEMP/original-keychains.txt"
          if [[ -f "$original_keychains_file" ]]; then
            original_keychains=()
            while IFS= read -r keychain; do
              [[ -n "$keychain" ]] && original_keychains+=("$keychain")
            done < "$original_keychains_file"
            if ((${#original_keychains[@]} > 0)); then
              security list-keychains -d user -s "${original_keychains[@]}"
            fi
          fi
          security delete-keychain "$keychain_path" >/dev/null 2>&1
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/AuthKey.p8" \
            "$RUNNER_TEMP/signing-identities.txt" \
            "$original_keychains_file"