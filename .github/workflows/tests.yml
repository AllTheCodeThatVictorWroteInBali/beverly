name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Run doctests
        run: cargo test --workspace --doc

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Rust documentation
        run: cargo doc --workspace --no-deps

      - name: Build mdBook documentation
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: Validate mdBook
        run: mdbook build docs

  features:
    name: Feature configuration (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default-features
            command: cargo test --workspace --all-targets --no-default-features
          - name: http-form
            command: cargo test --workspace --all-targets --no-default-features --features http_form
          - name: all-features
            command: cargo test --workspace --all-targets --all-features

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test feature configuration
        run: ${{ matrix.command }}